<div id="imdf-review-demo" class="viz-carousel viz-dotted-background" aria-label="앵커 후보 검토 UX" data-previous-label="이전 디자인" data-next-label="다음 디자인">
  <section data-variant="후보 카드" aria-label="후보 카드로 방향 검토">
    <div class="ar-window" data-mode="cards">
      <header><span>IM-DFrnt</span><span class="ar-subtle">위치 검토 · 개념 예시</span></header>
      <div class="ar-body">
        <h3>주출입구가 어느 쪽을 향하나요?</h3>

          <span class="ar-north">↑ 북쪽</span>
          <div class="ar-road">도로</div>
          <div class="ar-footprint">
            <div class="ar-plan"><span class="ar-room">전시홀</span><span class="ar-lobby">로비</span><span class="ar-door">주출입구</span></div>
          </div>
          <span class="ar-canvas-label">지도 외곽 · 도면 겹쳐보기</span>
        </div>
        <div class="ar-options">
          <button type="button" data-choice="0" aria-pressed="true" class="cursor-interaction"><span>A · 도로 쪽</span><small>주출입구 북쪽</small></button>
          <button type="button" data-choice="1" aria-pressed="false" class="cursor-interaction"><span>B · 반대쪽</span><small>주출입구 남쪽</small></button>
        </div>
        <div class="ar-choice" aria-live="polite">A · 주출입구 북쪽</div>
        <div class="ar-actions">
          <button type="button" data-action="previous" aria-label="이전 후보" class="cursor-interaction">←</button>
          <button type="button" data-action="next" aria-label="다음 후보" class="cursor-interaction">→</button>
          <button type="button" data-action="confirm" class="ar-primary cursor-interaction">이 방향으로 확정 ↵</button>
          <button type="button" data-action="defer" class="ar-plain cursor-interaction">판단하기 어려움</button>
        </div>
      </div>
    </div>
  </section>
  <section data-variant="방향 버튼" aria-label="방향 버튼으로 방향 검토" hidden>
    <div class="ar-window" data-mode="directions">
      <header><span>IM-DFrnt</span><span class="ar-subtle">위치 검토 · 개념 예시</span></header>
      <div class="ar-body">
        <h3>주출입구가 어느 쪽을 향하나요?</h3>
        <p class="ar-subtle">건물 외곽은 두 방향에서 같습니다.</p>
        <div class="ar-canvas" role="img" aria-label="북쪽이 위로 고정된 건물 배치. 북쪽 또는 남쪽 출입구 방향을 고릅니다.">
          <span class="ar-north">↑ 북쪽</span>
          <div class="ar-road">도로</div>
          <div class="ar-footprint">
            <div class="ar-plan"><span class="ar-room">전시홀</span><span class="ar-lobby">로비</span><span class="ar-door">주출입구</span></div>
          </div>
          <span class="ar-canvas-label">지도 외곽 · 도면 겹쳐보기</span>
        </div>
        <div class="ar-options ar-direction-options">
          <button type="button" data-choice="0" aria-pressed="true" class="cursor-interaction"><span>↑ 북쪽</span><small>도로 쪽</small></button>
          <button type="button" data-choice="1" aria-pressed="false" class="cursor-interaction"><span>↓ 남쪽</span><small>반대쪽</small></button>
        </div>
        <div class="ar-choice" aria-live="polite">A · 주출입구 북쪽</div>
        <div class="ar-actions">
          <button type="button" data-action="confirm" class="ar-primary cursor-interaction">이 방향으로 확정 ↵</button>
          <button type="button" data-action="defer" class="ar-plain cursor-interaction">판단하기 어려움</button>
        </div>
      </div>
    </div>
  </section>
</div>
<style>
  #imdf-review-demo { padding: 18px 0; }
  #imdf-review-demo .ar-window {
    --ar-bg: light-dark(#ffffff, #242426);
    --ar-fg: light-dark(#232326, #f0f0f2);
    --ar-secondary: light-dark(#626267, #b8b8bf);
    --ar-stroke: light-dark(#c9c9cf, #5c5c62);
    --ar-inset: light-dark(#f3f3f5, #303034);
    --ar-road: light-dark(#dfdfe4, #4a4a50);
    --ar-blue: light-dark(#1266bd, #74baff);
    --ar-blue-fill: light-dark(#e5f1ff, #233d57);
    --ar-door: light-dark(#9d3a12, #ffb58d);
    --ar-door-fill: light-dark(#fff0e6, #573a2d);
    --ar-selected-bg: light-dark(#252529, #eeeeef);
    --ar-selected-fg: light-dark(#ffffff, #242426);
    color-scheme: light dark;
    background: var(--ar-bg); color: var(--ar-fg);
    border: 1px solid var(--ar-stroke); border-radius: 12px;
    max-width: 620px; margin: 0 auto; overflow: hidden;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #imdf-review-demo .ar-window header { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 12px 18px; background: var(--ar-inset); }
  #imdf-review-demo .ar-body { padding: 18px; }
  #imdf-review-demo h3 { margin: 0; font-size: 18px; font-weight: 500; }
  #imdf-review-demo p { margin: 5px 0 16px; }
  #imdf-review-demo .ar-subtle { color: var(--ar-secondary); }
  #imdf-review-demo .ar-canvas { position: relative; height: 244px; background: var(--ar-inset); border-radius: 8px; overflow: hidden; }
  #imdf-review-demo .ar-north { position: absolute; right: 14px; top: 8px; font-size: 12px; }
  #imdf-review-demo .ar-road { position: absolute; top: 35px; left: 0; right: 0; background: var(--ar-road); text-align: center; padding: 3px; }
  #imdf-review-demo .ar-footprint { position: absolute; left: 50%; top: 85px; transform: translateX(-50%); width: 68%; max-width: 320px; height: 124px; border: 2px solid var(--ar-stroke); }
  #imdf-review-demo .ar-plan { position: absolute; inset: 3px; border: 2px solid var(--ar-blue); background: var(--ar-blue-fill); }
  #imdf-review-demo .ar-room { position: absolute; inset: 40px 0 0; text-align: center; padding-top: 18px; }
  #imdf-review-demo .ar-lobby { position: absolute; left: 0; right: 0; top: 0; text-align: center; border-bottom: 1px solid var(--ar-blue); height: 35px; padding-top: 6px; }
  #imdf-review-demo .ar-door { position: absolute; left: 50%; top: -20px; transform: translateX(-50%); color: var(--ar-door); background: var(--ar-door-fill); border: 1px solid var(--ar-door); border-radius: 5px; padding: 2px 6px; white-space: nowrap; font-size: 12px; }
  #imdf-review-demo .ar-plan.reversed .ar-room { inset: 0 0 40px; padding-top: 20px; }
  #imdf-review-demo .ar-plan.reversed .ar-lobby { top: auto; bottom: 0; border-bottom: 0; border-top: 1px solid var(--ar-blue); }
  #imdf-review-demo .ar-plan.reversed .ar-door { top: auto; bottom: -20px; }
  #imdf-review-demo .ar-canvas-label { position: absolute; bottom: 6px; left: 12px; font-size: 11px; color: var(--ar-secondary); }
  #imdf-review-demo .ar-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  #imdf-review-demo button { font: inherit; color: var(--ar-fg); background: var(--ar-bg); border: 1px solid var(--ar-stroke); border-radius: 7px; padding: 8px 12px; min-height: 38px; }
  #imdf-review-demo .ar-options button { text-align: left; display: flex; flex-direction: column; gap: 2px; }
  #imdf-review-demo button small { font-size: 12px; }
  #imdf-review-demo button[aria-pressed="true"], #imdf-review-demo button.ar-primary { background: var(--ar-selected-bg); color: var(--ar-selected-fg); border-color: var(--ar-selected-bg); }
  #imdf-review-demo .ar-choice { margin: 12px 0; font-size: 12px; min-height: 18px; }
  #imdf-review-demo .ar-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 42px; }
  #imdf-review-demo button.ar-plain { border-color: transparent; }
  @media (max-width: 420px) {
    #imdf-review-demo .ar-body { padding: 14px; }
    #imdf-review-demo .ar-options { gap: 7px; }
    #imdf-review-demo .ar-actions .ar-primary { flex: 1; }
    #imdf-review-demo .ar-actions .ar-plain { width: 100%; }
  }
  @media (pointer: coarse) { #imdf-review-demo button { min-height: 44px; } }
</style>
<script>
(() => {
  const root = document.getElementById("imdf-review-demo");
  const saved = window.openai?.widgetState?.privateContent;
  const panels = Array.from(root.querySelectorAll(".ar-window"));
  const states = panels.map((panel, index) => ({
    choice: saved?.choices?.[index] === 1 ? 1 : 0,
    outcome: "preview"
  }));
  function render(index) {
    const panel = panels[index];
    const state = states[index];
    panel.querySelector(".ar-plan").classList.toggle("reversed", state.choice === 1);
    panel.querySelectorAll("[data-choice]").forEach(button => {
      button.setAttribute("aria-pressed", String(Number(button.dataset.choice) === state.choice));
    });
    const name = state.choice === 0 ? "A · 주출입구 북쪽" : "B · 주출입구 남쪽";
    panel.querySelector(".ar-choice").textContent = state.outcome === "confirmed"
      ? `${name} · 선택 확정 (예시)`
      : state.outcome === "deferred" ? "검토 보류 · 추가 단서 필요" : name;
  }
  function save() {
    if (window.openai?.setWidgetState) {
      window.openai.setWidgetState({
        modelContent: null,
        privateContent: { choices: states.map(state => state.choice) }
      }).catch(() => {});
    }
  }
  function choose(index, choice) {
    states[index].choice = (choice + 2) % 2;
    states[index].outcome = "preview";
    render(index);
    save();
  }
  panels.forEach((panel, index) => {
    panel.querySelectorAll("[data-choice]").forEach(button => {
      button.addEventListener("click", () => choose(index, Number(button.dataset.choice)));
    });
    panel.querySelectorAll("[data-action]").forEach(button => {
      button.addEventListener("click", () => {
        const action = button.dataset.action;
        if (action === "previous" || action === "next") {
          choose(index, states[index].choice + (action === "next" ? 1 : -1));
        } else {
          states[index].outcome = action === "confirm" ? "confirmed" : "deferred";
          render(index);
        }
      });
    });
    panel.addEventListener("keydown", event => {
      if (event.target.matches("input,textarea,select") || event.target.isContentEditable) return;
      if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
        event.preventDefault();
        choose(index, states[index].choice + (event.key === "ArrowRight" ? 1 : -1));
      } else if (panel.dataset.mode === "directions" && (event.key === "ArrowUp" || event.key === "ArrowDown")) {
        event.preventDefault();
        choose(index, event.key === "ArrowUp" ? 0 : 1);
      } else if (event.key === "Enter" && event.target.dataset?.action !== "defer") {
        event.preventDefault();
        states[index].outcome = "confirmed";
        render(index);
      } else if (event.key === "Escape") {
        states[index].outcome = "deferred";
        render(index);
      }
    });
    render(index);
  });
  window.addEventListener("openai:set_globals", event => {
    const incoming = event.detail?.globals?.widgetState?.privateContent;
    if (!incoming) return;
    states.forEach((state, index) => { state.choice = incoming.choices?.[index] === 1 ? 1 : 0; render(index); });
  });
})();
</script>
